name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Containerfile
          push: true
          tags: |
            ghcr.io/fadykuzman/sewing-inventory-app/backend:latest
            ghcr.io/fadykuzman/sewing-inventory-app/backend:${{ github.sha }}
